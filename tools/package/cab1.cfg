# CTR Native arcade config for cabinet 1.
# Copy this file to arcade.cfg next to ctr_native.exe, then edit it.
# One "key = value" per line. Lines starting with # or ; are comments.
# Comments must be on their own line: a value is the rest of its line.

# Folder that holds YOUR OWN ctr-u.bin (or the extracted BIGFILE.BIG files).
# The package contains no game data. A relative path is relative to the
# folder of ctr_native.exe.
data_dir = C:\ctr-data

# This cabinet's seat and local UDP port.
seat = cab1
port = 7001

# The other cabinet (cab2): its fixed IP address and its port.
# EDIT the IP to the fixed IP of cabinet 2.
peer = 192.168.1.102:7002

# 1 = fullscreen, 0 = windowed.
fullscreen = 1
