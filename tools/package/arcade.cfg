# CTR Native arcade config. Every cabinet uses this same file, unchanged:
# the cabinets find each other on the local network and elect their seats.
# It ships as arcade.cfg next to ctr_native.exe, where the game reads it.
# One "key = value" per line. Lines starting with # or ; are comments.
# Comments must be on their own line: a value is the rest of its line.

# Folder that holds YOUR OWN ctr-u.bin disc image. The package contains no
# game data. A linked cabinet needs ctr-u.bin: with only the extracted
# BIGFILE.BIG files it stops at startup (those serve an unlinked run only).
# For a link the folder holds ONLY ctr-u.bin (no extracted files beside it).
# Both cabinets need the same ctr-u.bin. A relative path is relative to the
# folder of ctr_native.exe.
data_dir = C:\ctr-data

# This cabinet's seat. auto: the seats are elected (every cabinet uses this
# same file). seat = cab1 or seat = cab2 is an optional fixed-seat override;
# two cabinets that fix the same seat never link.
seat = auto

# Optional. This cabinet's UDP link port; the default is 7001. It must
# differ from the discovery port, 7000.
# port = 7001

# Optional. A group name keeps two installations on one network apart:
# only cabinets with the same group link. Both cabinets need the same one.
# group = <name>

# Static override, instead of discovery, on BOTH cabinets: a fixed seat
# (cab1 on one cabinet, cab2 on the other), a port, and the other
# cabinet's fixed IP and port, with no group:
#   seat = cab1|cab2
#   port = 7001
#   peer = a.b.c.d:port
# A static cabinet does not look for the other one: a pair of one static
# and one discovery cabinet never links.

# 1 = fullscreen, 0 = windowed.
fullscreen = 1

# Render scale 1, 2, 3, 4, 6, or 8 (8 = sharpest; this cabinet only).
render_scale = 8

# Texture filter nearest (blocky, as the PS1) or bilinear (smooth).
texture_filter = bilinear
